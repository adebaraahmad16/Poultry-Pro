<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Subtle Depth Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.22" flood-color="#022c22" />
    </filter>
  </defs>

  <!-- Squircle Base / Tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#16A34A" />
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />

  <!-- Central Emblem Group with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Rooster Comb (Crown) -->
    <path d="M52 28 C52 23, 60 21, 63 26 C66 21, 75 22, 77 27 C80 23, 89 25, 87 32 C86 35, 81 38, 76 40 C68 40, 58 36, 52 28 Z" 
          fill="#F59E0B" />

    <!-- Rooster Head and Neck Profile (Sleek Modern Bird) -->
    <path d="M48 40 C56 36, 73 37, 82 43 C87 46, 88 51, 84 55 C77 62, 76 74, 82 86 C85 91, 83 96, 76 96 C63 96, 44 88, 40 70 C37 57, 41 44, 48 40 Z" 
          fill="#FFFFFF" />

    <!-- Sharp Tech Beak -->
    <path d="M82 48 L101 54 C103 55, 102 58, 99 59 L80 64 Z" 
          fill="#F59E0B" />

    <!-- Wattle Accent -->
    <path d="M80 65 C85 66, 88 72, 85 78 C82 82, 76 82, 75 75 Z" 
          fill="#DC2626" />

    <!-- Eye (Modern Smart Dot) -->
    <circle cx="68" cy="49" r="4.5" fill="#15803D" />
    <circle cx="69.5" cy="47.5" r="1.5" fill="#FFFFFF" />

    <!-- Growth Leaf / Tech Feather Accent -->
    <path d="M46 64 C50 56, 61 56, 66 61 C64 70, 55 74, 46 64 Z" 
          fill="#16A34A" opacity="0.85" />
  </g>
</svg>
